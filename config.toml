# Shared runtime configuration. Edit this file to enable components.
# Secrets and machine-specific overrides belong in .env.

# App
runtime_profile = "pc"
host = "127.0.0.1"
port = 8787
log_level = "INFO"
data_dir = "./data"
store_audio = false
store_transcripts = false

# Long-term memory: explicit user requests, shared across sessions of this driver.
# Database defaults to <data_dir>/memory/long_term.sqlite3; optional memory_db override.
memory_enabled = true
memory_profile_id = "default"
memory_context_limit = 8
memory_context_max_characters = 2000

# Vehicle simulator: memory or mqtt
vehicle_provider = "memory"
vehicle_id = "demo-car-1"
mqtt_host = "127.0.0.1"
mqtt_port = 1883
mqtt_timeout_seconds = 3
# Local-only HTTP control used by Engineer Dashboard only when vehicle_provider = "mqtt".
vehicle_simulator_url = "http://127.0.0.1:8788"

# One checkpoint-owned workflow. Availability fallback: cloud -> configured local -> parser.
turn_timeout_seconds = 120
cloud_budget_seconds = 10
local_budget_seconds = 60
provider_breaker_seconds = 30
planner_max_tokens = 2048
conversation_enabled = true
information_enabled = true
tavily_monthly_limit = 900
information_timeout_seconds = 12
information_http_timeout_seconds = 4
information_max_results = 5
information_timezone = "Asia/Ho_Chi_Minh"

# Language model: rules, local, openai, google, openrouter
# Cloud providers require rag_local_only = false.
llm_provider = "local"
llm_timeout_seconds = 60
openai_model = "gpt-4o-mini"
google_model = "gemini-3.5-flash-lite"
google_base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
google_max_tokens = 4096
google_reasoning_effort = "low"
openrouter_model = "qwen/qwen3.7-flash"
openrouter_reasoning = false
openrouter_max_tokens = 1536
local_llm_base_url = "http://127.0.0.1:1234/v1"
local_llm_api_key = "local"
local_llm_model = "vivi-qwen3-1.7b"
local_llm_max_tokens = 512

# Private AI gateway: can run on Jetson, this PC, or another reachable server.
# Change only this URL; /v1 and the shared authentication are wired automatically.
# Docker: use the server's LAN/Tailscale IP, or host.docker.internal for the host PC.
# Authentication is optional for personal testing on a private network.
ai_server_url = "http://100.123.27.125:8789"
ai_server_auth_required = false
jetson_ai_policy = "prefer_local"
# To use a standalone LM Studio/llama.cpp server instead, set policy = "disabled"
# and configure local_llm_base_url / local_llm_api_key above.

# Speech: provider = off to disable; preload = true to load at startup
stt_provider = "jetson"
stt_fallback_provider = "off"
stt_fallback_preload = false
phowhisper_model = "vinai/PhoWhisper-medium"
phowhisper_device = "auto"
phowhisper_dtype = "auto"
phowhisper_preload = false
phowhisper_language = "vi"
whisper_cpp_binary = "./models/whisper.cpp/build/bin/whisper-cli"
whisper_cpp_model = "./models/whisper.cpp/models/ggml-base.bin"
ffmpeg_binary = "ffmpeg"
soniox_model = "stt-rt-v5"
soniox_language_hints = "vi"
soniox_language_hints_strict = false
soniox_endpoint_detection = true
soniox_max_endpoint_delay_ms = 1000
soniox_timeout_seconds = 30
soniox_stream_max_seconds = 60

tts_provider = "vieneu"
zerotts_model = "zeroweight-ai/ZeroTTS"
zerotts_voice = "VIVI"
zerotts_device = "auto"
zerotts_preload = false
# VieNeu cloud TTS (key: VIENEU_API_KEY in .env). PCM is streamed to the browser.
vieneu_voice = "Tưởng Vy"
vieneu_sample_rate = 24000

# Navigation (VietMap). Key goes in .env as VIETMAP_API_KEY.
# Map style: tm = street, lm = light, dm = dark
vietmap_map_style = "dm"
# Fallback origin when the browser cannot share its location.
navigation_default_lat = 20.9912738
navigation_default_lng = 105.9457946
navigation_default_label = "VinUni"

# Handbook retrieval
rag_data_dir = "./data/handbooks"
rag_history_db = "./data/vivi_rag.sqlite3"
rag_handbook_db = "./data/handbooks/handbook.sqlite3"
rag_retrieval_mode = "sqlite_local"
rag_local_embedding_dir = "./models/multilingual-e5-small-int8"
rag_local_only = false
rag_embedding_threads = 2
rag_embedding_batch_size = 4
# No calibrated rejection threshold yet; do not infer answerability from cosine alone.
rag_local_min_similarity = 0.0
rag_default_vehicle_model = "VF8"
rag_default_model_year = 2026
rag_default_locale = "vi_vn"
rag_retrieval_k = 12
rag_final_k = 5
rag_history_turns = 6
rag_prompt_max_characters = 6000

# Adaptive gateway observations; manual provider choices remain preferences.
internet_probe_url = "https://clients3.google.com/generate_204"
internet_probe_timeout_seconds = 1.5
connectivity_probe_interval_seconds = 2.0
connectivity_failure_threshold = 2
connectivity_success_threshold = 2
connectivity_retention_days = 7
