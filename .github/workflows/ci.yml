name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src vehicle_simulator tests
      - name: JavaScript syntax
        run: node --check app.js
      - name: Unit tests
        run: mkdir -p reports && pytest --ignore=tests/test_mqtt_vehicle.py --junitxml=reports/unit.xml
      - name: Upload unit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit.xml
          if-no-files-found: ignore

  mqtt-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Mosquitto and development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes mosquitto mosquitto-clients
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: MQTT integration tests
        run: mkdir -p reports && pytest tests/test_mqtt_vehicle.py --junitxml=reports/mqtt.xml
      - name: Upload MQTT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mqtt-test-report
          path: reports/mqtt.xml
          if-no-files-found: ignore

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test non-root image
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          scripts/check_docker.sh 2>&1 | tee reports/docker-smoke.log
      - name: Upload Docker smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-report
          path: reports/docker-smoke.log
          if-no-files-found: ignore
