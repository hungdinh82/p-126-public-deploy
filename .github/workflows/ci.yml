name: CI

# Chạy toàn bộ quality gates (ruff + pytest + JS syntax + JS tests)
# đã viết trong scripts/check_local.sh. Workflow deploy-render.yml trên
# nhánh main tự chạy lại bộ này trước khi publish image, nên CI chỉ cần
# gác pull request và các nhánh feature.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Dùng self-hosted runner cùng nhóm với deploy-render.yml để tránh
    # hạn mức GitHub-hosted của tổ chức.
    runs-on: self-hosted

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            requirements-rag-base.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create virtual environment and install dev deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run quality gates (ruff + JS syntax + JS tests + pytest)
        run: bash scripts/check_local.sh
