name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release quality gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the release commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in main" >&2
            exit 1
          fi

      - name: Validate semantic version tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must follow SemVer, for example v0.1.0 or v0.2.0-rc.1" >&2
            exit 1
          fi

      - name: Build release evidence
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p release
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          manifest = {
              "schema_version": 1,
              "release": os.environ["RELEASE_VERSION"],
              "commit_sha": os.environ["RELEASE_SHA"],
              "created_at": datetime.now(UTC).isoformat(),
              "python_target": "3.11",
              "runtime": "src.vivi.api.app:app",
              "validated_profile": {
                  "llm": "rules",
                  "stt": "off",
                  "tts": "off",
                  "vehicle": "memory",
                  "retrieval": "sqlite",
              },
              "notes": "PhoWhisper, ZeroTTS, OpenAI and MQTT demo acceptance remain manual gates.",
          }
          Path("release/release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum \
            Dockerfile \
            requirements.txt \
            requirements-ai.txt \
            requirements-dev.txt \
            data/handbooks/handbook.sqlite3 \
            voices/VIVI.zip \
            > release/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/release-manifest.json \
            release/SHA256SUMS \
            --title "ViVi $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
