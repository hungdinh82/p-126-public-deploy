version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      STT_PROVIDER: "off"
      PHOWHISPER_PRELOAD: "false"
      TTS_PROVIDER: "off"
      ZEROTTS_PRELOAD: "false"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
